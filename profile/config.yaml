snakefile: workflow/Snakefile
configfile: inputs/config.yaml

rerun-incomplete: True
latency-wait: 120
keep-going: True
keep-incomplete: False

# conda specifications
use-conda: True
conda-frontend: conda

# Use the SLURM executor plugin (replaces the old --cluster flag)
executor: slurm

# number of jobs running at once
jobs: 10

# Default SLURM resources
default-resources:
  - slurm_partition="mit_preemptable"
  - slurm_account="mit_general"
  - slurm_extra="'--requeue'"
  - runtime=43200
  - mem_mb=48000
  - cpus_per_task=1
  - tasks=1

# Per-rule overrides
set-resources:
  run_trim_PE:
    cpus_per_task: 10
    mem_mb: 192000
  kaiju_run:
    cpus_per_task: 10
    mem_mb: 192000
  blast_reads:
    cpus_per_task: 10
    mem_mb: 64000
  normalize_reads:
    mem_mb: 64000
